name: pipeleap
description: "PipeLeap — original side-scrolling platformer built with Flutter and Flame"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  image: ^4.9.1
  gamepads: ^0.1.10+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/hero_frames/
    - assets/audio/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/store/icon_1024.png
  adaptive_icon_background: "#049CD8"
  adaptive_icon_foreground: assets/store/icon_1024.png
  min_sdk_android: 21
